<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BloodMoonKing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia,serif;
}

body{
background:url("background.png") center center/cover no-repeat fixed;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
padding:20px;
}

body::before{
content:"";
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
backdrop-filter:blur(2px);
}

.container{
position:relative;
z-index:5;
width:100%;
max-width:420px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:35px 25px;
background:rgba(0,0,0,.45);
border:2px solid rgba(255,0,0,.45);
border-radius:22px;
box-shadow:0 0 35px rgba(255,0,0,.45);
}

h1{
width:100%;
font-size:48px;
line-height:1.1;
color:#ff2020;
letter-spacing:2px;
text-shadow:
0 0 10px red,
0 0 25px crimson,
0 0 45px darkred;
margin-bottom:15px;
word-break:break-word;
}

p{
color:#ddd;
font-size:21px;
line-height:1.4;
margin-bottom:30px;
letter-spacing:1px;
text-align:center;
}

.btn{
display:block;
width:100%;
max-width:320px;
padding:18px;
margin:12px auto;
text-decoration:none;
text-align:center;
font-size:20px;
font-weight:bold;
color:white;
background:linear-gradient(180deg,#8d0000,#250000);
border:2px solid #ff2b2b;
border-radius:14px;
transition:.3s;
box-shadow:0 0 18px rgba(255,0,0,.45);
}

.btn:hover{
transform:scale(1.05);
background:#b00000;
box-shadow:0 0 30px red;
}

.bat{
position:absolute;
font-size:18px;
opacity:.2;
color:#ff4444;
animation:pulse 2s infinite;
pointer-events:none;
}

@keyframes pulse{
0%{
opacity:0;
transform:scale(.4);
}
50%{
opacity:1;
transform:scale(1.3);
}
100%{
opacity:0;
transform:scale(.4);
}
}

</style>

</head>

<body>

<div class="container">

<h1>BloodMoonKing</h1>

<p>
Welcome To The Kingdom Of The Blood Moon
</p>

<a class="btn"
href="https://www.mediafire.com/file/mdqzf5cy0ogvr81/BloodMoonKing.apk/file">

⬇ Download BloodMoonKing

</a>

<a class="btn"
href="https://www.mediafire.com/file/ap2fwma0gp5brm0/Tokens.zip/file">

🩸 Download Tokens Apps

</a>

</div>

<script>

for(let i=0;i<45;i++){

let bat=document.createElement("div");

bat.className="bat";

bat.innerHTML="🦇";

bat.style.left=Math.random()*100+"vw";
bat.style.top=Math.random()*100+"vh";
bat.style.animationDelay=(Math.random()*4)+"s";
bat.style.fontSize=(12+Math.random()*16)+"px";

document.body.appendChild(bat);

}

</script>

</body>
</html>
