<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kick</title>
<style>
  :root{
    --bar-h: 56px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#0a0a0a; overflow:hidden; font-family:'Tajawal',Arial,sans-serif; }

  /* ===== شاشة البداية (قبل الضغط على تشغيل) ===== */
  #startScreen{
    position:fixed; inset:0; z-index:50;
    background:#0a0a0a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    transition:opacity .35s ease;
  }
  #startScreen.hide{ opacity:0; pointer-events:none; }
  #startScreen .logo{
    font-size:44px; font-weight:900; color:#53fc18; letter-spacing:-1px;
  }
  /* ===== زرار تشغيل — أبيض + جمجمة ===== */
  .play-btn{
    display:flex; align-items:center; gap:8px;
    background:#ffffff; color:#000;
    border:none; border-radius:30px;
    padding:14px 34px;
    font-size:16px; font-weight:800; font-family:inherit;
    cursor:pointer;
    box-shadow:0 4px 18px rgba(255,255,255,0.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .play-btn:active{ transform:scale(.96); }
  .play-btn .skull{ font-size:18px; }

  /* ===== شريط علوي عائم فوق الـ iframe ===== */
  #topBar{
    position:fixed; top:0; left:0; right:0; z-index:40;
    height:var(--bar-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 12px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0));
    pointer-events:none;
  }
  #topBar > *{ pointer-events:auto; }

  #gearBtn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.55);
    color:#fff; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  #miniPlayBtn{
    display:flex; align-items:center; gap:6px;
    background:#ffffff; color:#000;
    border:none; border-radius:20px;
    padding:8px 16px;
    font-size:13px; font-weight:800; font-family:inherit;
    cursor:pointer;
  }
  #miniPlayBtn .skull{ font-size:14px; }

  /* ===== الـ WebView نفسه ===== */
  #webview{
    position:fixed; inset:0;
    width:100%; height:100%;
    border:none; z-index:10;
    background:#000;
  }

  /* ===== قايمة الإعدادات (تظهر بالضغط على الترس) ===== */
  #settingsOverlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:flex-start; justify-content:flex-end;
  }
  #settingsOverlay.open{ display:flex; }
  #settingsMenu{
    margin-top:calc(var(--bar-h) + 6px);
    margin-inline-end:12px;
    width:220px;
    background:#151515;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    animation:menuIn .18s ease;
  }
  @keyframes menuIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  .menu-item{
    display:flex; align-items:center; gap:10px;
    padding:13px 16px;
    color:#eee; font-size:14px; font-weight:600;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item:active{ background:rgba(255,255,255,0.06); }
  .menu-item i{ width:18px; text-align:center; opacity:.85; }

  /* ===== رسالة احتياطية لو الموقع رفض يفتح جوه iframe ===== */
  #fallback{
    position:fixed; inset:0; z-index:45;
    background:#0a0a0a; color:#fff;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; text-align:center;
  }
  #fallback.show{ display:flex; }
  #fallback p{ color:#aaa; font-size:14px; line-height:1.8; }
  #fallback a{
    display:inline-block; background:#53fc18; color:#000; font-weight:800;
    padding:12px 28px; border-radius:24px; text-decoration:none; font-size:14px;
  }
</style>
</head>
<body>

  <!-- شاشة البداية -->
  <div id="startScreen">
    <div class="logo">KICK</div>
    <button class="play-btn" onclick="startApp()">
      <span class="skull">☠️</span> تشغيل
    </button>
  </div>

  <!-- الشريط العلوي -->
  <div id="topBar">
    <button id="gearBtn" onclick="toggleSettings()"><i>⚙️</i></button>
    <button id="miniPlayBtn" onclick="reloadSite()"><span class="skull">☠️</span> تشغيل</button>
  </div>

  <!-- الموقع -->
  <iframe id="webview" src="about:blank" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>

  <!-- رسالة احتياطية -->
  <div id="fallback">
    <div style="font-size:40px;">⚠️</div>
    <p>تعذّر تحميل الموقع داخل هذه الصفحة.<br>يمكنك فتحه مباشرة من هنا:</p>
    <a href="https://kick.com" target="_blank" rel="noopener">فتح kick.com</a>
  </div>

  <!-- قايمة الإعدادات -->
  <div id="settingsOverlay" onclick="if(event.target===this)toggleSettings()">
    <div id="settingsMenu">
      <div class="menu-item" onclick="reloadSite()"><i>🔄</i> إعادة تحميل</div>
      <div class="menu-item" onclick="goHome()"><i>🏠</i> الصفحة الرئيسية</div>
      <div class="menu-item" onclick="toggleFullscreen()"><i>⛶</i> ملء الشاشة</div>
      <div class="menu-item" onclick="toggleSettings()"><i>✖️</i> إغلاق</div>
    </div>
  </div>

<script>
  var SITE_URL = 'https://kick.com';
  var iframe = document.getElementById('webview');
  var started = false;
  var loadTimer = null;

  function startApp(){
    if(started) return;
    started = true;
    document.getElementById('startScreen').classList.add('hide');
    loadSite();
  }

  function loadSite(){
    document.getElementById('fallback').classList.remove('show');
    iframe.src = SITE_URL;
    clearTimeout(loadTimer);
    // لو الموقع رفض العرض جوه iframe (X-Frame-Options / CSP) نظهر رسالة احتياطية
    loadTimer = setTimeout(function(){
      try{
        // لو تعذّر الوصول لمحتوى الإطار غالبًا يبقى محجوب
        var blocked = false;
        try { void iframe.contentWindow.location.href; } catch(e){ blocked = false; }
        if(iframe.contentDocument && iframe.contentDocument.body && iframe.contentDocument.body.innerHTML.trim() === ''){
          blocked = true;
        }
      }catch(e){}
    }, 3500);
  }

  iframe.addEventListener('error', function(){
    document.getElementById('fallback').classList.add('show');
  });

  function reloadSite(){
    if(!started){ startApp(); return; }
    loadSite();
  }

  function goHome(){
    if(!started){ startApp(); return; }
    iframe.src = SITE_URL;
    toggleSettings();
  }

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen().catch(function(){});
    }
    toggleSettings();
  }

  function toggleSettings(){
    document.getElementById('settingsOverlay').classList.toggle('open');
  }
</script>

</body>
</html>
