<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BloodMoonKing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia,serif;
}

body{

background:url("background.png") center center/cover no-repeat fixed;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

body::before{

content:"";

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.65);

backdrop-filter:blur(2px);

}

.container{

position:relative;

z-index:5;

text-align:center;

padding:40px;

width:90%;

max-width:700px;

border:1px solid rgba(255,0,0,.35);

background:rgba(0,0,0,.45);

border-radius:18px;

box-shadow:0 0 40px #4d0000;

}

h1{

font-size:55px;

color:#ff2020;

letter-spacing:5px;

text-shadow:

0 0 10px red,

0 0 25px crimson,

0 0 45px darkred;

margin-bottom:15px;

}

p{

color:#ddd;

font-size:20px;

margin-bottom:35px;

letter-spacing:2px;

}

.btn{

display:block;

margin:18px auto;

width:320px;

padding:18px;

text-decoration:none;

font-size:20px;

font-weight:bold;

color:white;

background:linear-gradient(180deg,#7a0000,#220000);

border:2px solid #ff2b2b;

border-radius:14px;

transition:.4s;

box-shadow:0 0 18px rgba(255,0,0,.45);

}

.btn:hover{

transform:scale(1.06);

background:#b00000;

box-shadow:0 0 35px red;

}

.bat{

position:absolute;

font-size:22px;

animation:pulse 2s infinite;

opacity:.2;

color:#ff0000;

}

@keyframes pulse{

0%{

opacity:0;

transform:scale(.4);

}

50%{

opacity:1;

transform:scale(1.3);

}

100%{

opacity:0;

transform:scale(.4);

}

}

</style>

</head>

<body>

<div class="container">

<h1>BloodMoonKing</h1>

<p>
Welcome To The Kingdom Of The Blood Moon
</p>

<a class="btn"
href="https://www.mediafire.com/file/mdqzf5cy0ogvr81/BloodMoonKing.apk/file">

⬇ Download BloodMoonKing

</a>

<a class="btn"
href="https://www.mediafire.com/file/ap2fwma0gp5brm0/Tokens.zip/file">

🩸 Download Tokens Apps

</a>

</div>

<script>

for(let i=0;i<45;i++){

let bat=document.createElement("div");

bat.className="bat";

bat.innerHTML="🦇";

bat.style.left=Math.random()*100+"vw";

bat.style.top=Math.random()*100+"vh";

bat.style.animationDelay=(Math.random()*4)+"s";

bat.style.fontSize=(12+Math.random()*16)+"px";

document.body.appendChild(bat);

}

</script>

</body>

</html>
