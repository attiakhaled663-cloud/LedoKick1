<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Mod Pro</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #111214; color: #fff; margin: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1b1c1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #292a2d; padding-bottom: 15px; }
        .menu-dots { cursor: pointer; font-size: 26px; color: #53fc18; }
        .tabs { display: flex; gap: 10px; margin: 20px 0; }
        .tab-btn { background: #292a2d; color: #fff; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #53fc18; color: #000; }
        .account-box { background: #292a2d; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #555; }
        .account-box.live { border-left-color: #53fc18; }
        .account-box.offline { border-left-color: #ff4d4d; }
        .account-header { display: flex; justify-content: space-between; align-items: center; }
        .btn { border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ff4d4d; color: white; }
        .btn-settings { background: #2196F3; color: white; }
        .btn-renew { background: #ff9800; color: white; }
        .modal, .overlay { display: none; position: fixed; z-index: 1000; }
        .overlay { top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal { top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1b1c1e; padding: 25px; border-radius: 10px; width: 90%; max-width: 550px; box-shadow: 0 5px 20px rgba(0,0,0,0.6); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #111214; border: 1px solid #3a3b3c; color: white; border-radius: 6px; box-sizing: border-box; }
        .info-bar { background: #222426; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Kick Mod Web</h2>
        <div class="menu-dots" onclick="toggleJsonModal()">⋮</div>
    </div>

    <div class="info-bar">
        <span>الفاصل بين البوتات: <input type="number" id="botInterval" value="3" style="width:50px; padding:2px; margin:0; display:inline;"> ثوانٍ</span> | 
        <span id="refreshTimer">جاري المزامنة مع السيرفر...</span>
    </div>

    <div style="background: #222426; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h4 style="margin-top:0;">إضافة حساب جديد (Token)</h4>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="newTokenInput" placeholder="أدخل الـ Token...">
            <button class="btn" style="background:#53fc18; color:#000; min-width: 80px;" onclick="addAccount()">إضافة</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all')">الكل</button>
        <button class="tab-btn" onclick="switchTab('live')">مباشر (Live)</button>
        <button class="tab-btn" onclick="switchTab('off')">OFF</button>
    </div>

    <div id="accountsList"></div>
</div>

<div class="overlay" id="overlay" onclick="closeAllModals()"></div>
<div class="modal" id="settingsModal">
    <h3>إعدادات الحساب: <span id="modalAccName" style="color:#53fc18;"></span></h3>
    
    <label>اسم القناة المستهدفة:</label>
    <input type="text" id="channelNameInput" placeholder="اسم القناة">
    
    <label>الرسائل (رسالة في كل سطر):</label>
    <textarea id="channelMessages" rows="5"></textarea>
    
    <label>سرعة الإرسال (بالثواني):</label>
    <input type="number" id="sendSpeed" value="240">

    <label style="display: flex; align-items: center; gap: 8px; margin: 15px 0; cursor: pointer;">
        <input type="checkbox" id="randomSend" style="width: auto; margin:0;"> إرسال رسائل عشوائية
    </label>

    <div style="display:flex; gap:10px; margin-top: 20px;">
        <button class="btn" style="background:#53fc18; color:black; flex:1;" onclick="saveChannelSettings()">حفظ</button>
        <button class="btn btn-danger" onclick="closeAllModals()">إلغاء</button>
    </div>
</div>

<div class="modal" id="jsonModal">
    <h3>JSON البيانات</h3>
    <textarea id="jsonDataArea" rows="8"></textarea>
    <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn" style="background:#2196F3; color:white;" onclick="importData()">استعادة</button>
        <button class="btn" style="background:#4CAF50; color:white;" onclick="exportData()">توليد</button>
        <button class="btn btn-danger" onclick="closeAllModals()">إغلاق</button>
    </div>
</div>

<script>
    let appData = { botInterval: 3, accounts: [] };
    let currentEditingAccId = null;
    let currentTab = 'all';

    function loadDataFromServer() {
        fetch('/api/data')
            .then(res => res.json())
            .then(data => {
                appData = data;
                document.getElementById('botInterval').value = appData.botInterval;
                renderAccounts();
            })
            .catch(err => console.error("Error loading data:", err));
    }

    function saveToServer() {
        fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(appData)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                renderAccounts();
            }
        })
        .catch(err => console.error("Error saving data:", err));
    }

    function addAccount() {
        const tInput = document.getElementById('newTokenInput');
        const token = tInput.value.trim();
        if(!token) return;
        
        appData.accounts.push({
            id: Date.now(),
            token: token,
            name: "User_" + token.substring(0, 5),
            status: 'off',
            currentIndex: 0,
            settings: { channel: '', messages: '', speed: 240, random: false }
        });
        tInput.value = '';
        saveToServer();
    }

    function renewToken(id) {
        const nt = prompt("أدخل الـ Token الجديد:");
        if(nt) {
            const acc = appData.accounts.find(a => a.id === id);
            if(acc) { 
                acc.token = nt; 
                acc.name = "User_" + nt.substring(0, 5);
                saveToServer(); 
            }
        }
    }

    function deleteAccount(id, name) {
        if(confirm(`هل تريد حذف الحساب "${name}"؟`)) {
            appData.accounts = appData.accounts.filter(a => a.id !== id);
            saveToServer();
        }
    }

    function openSettings(id) {
        currentEditingAccId = id;
        const acc = appData.accounts.find(a => a.id === id);
        if(acc) {
            document.getElementById('modalAccName').innerText = acc.name;
            document.getElementById('channelNameInput').value = acc.settings.channel;
            document.getElementById('channelMessages').value = acc.settings.messages;
            document.getElementById('sendSpeed').value = acc.settings.speed;
            document.getElementById('randomSend').checked = acc.settings.random;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('settingsModal').style.display = 'block';
        }
    }

    function closeAllModals() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('settingsModal').style.display = 'none';
        document.getElementById('jsonModal').style.display = 'none';
    }

    function saveChannelSettings() {
        const acc = appData.accounts.find(a => a.id === currentEditingAccId);
        if(acc) {
            acc.settings.channel = document.getElementById('channelNameInput').value.trim().toLowerCase();
            acc.settings.messages = document.getElementById('channelMessages').value;
            acc.settings.speed = parseInt(document.getElementById('sendSpeed').value) || 240;
            acc.settings.random = document.getElementById('randomSend').checked;
            closeAllModals();
            saveToServer();
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderAccounts();
    }

    function renderAccounts() {
        const listDiv = document.getElementById('accountsList');
        listDiv.innerHTML = '';
        let filtered = appData.accounts;
        if(currentTab === 'live') filtered = appData.accounts.filter(a => a.status === 'live');
        if(currentTab === 'off') filtered = appData.accounts.filter(a => a.status === 'off');

        filtered.forEach(acc => {
            const box = document.createElement('div');
            box.className = `account-box ${acc.status}`;
            box.innerHTML = `
                <div class="account-header">
                    <div>
                        <strong>${acc.name}</strong> 
                        <span style="color:${acc.status === 'live' ? '#53fc18' : '#ff4d4d'}">
                            (${acc.status === 'live' ? '● مباشر' : '○ Offline'})
                        </span>
                        <div style="font-size:13px; color:#aaa; margin-top:5px;">
                            القناة: <span style="color:#fff;">${acc.settings.channel || 'لم تحدد'}</span> | 
                            السرعة: ${acc.settings.speed}ث | 
                            النظام: ${acc.settings.random ? 'عشوائي' : 'ترتيبي'}
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-renew" onclick="renewToken(${acc.id})">🔑</button>
                        <button class="btn btn-settings" onclick="openSettings(${acc.id})">⚙️</button>
                        <button class="btn btn-danger" onclick="deleteAccount(${acc.id}, '${acc.name}')">❌</button>
                    </div>
                </div>
            `;
            listDiv.appendChild(box);
        });
    }

    function toggleJsonModal() {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('jsonModal').style.display = 'block';
    }
    function exportData() { document.getElementById('jsonDataArea').value = JSON.stringify(appData, null, 2); }
    function importData() {
        try {
            appData = JSON.parse(document.getElementById('jsonDataArea').value);
            closeAllModals();
            saveToServer();
        } catch(e) { alert('Invalid JSON'); }
    }

    document.getElementById('botInterval').addEventListener('input', (e) => {
        appData.botInterval = parseInt(e.target.value) || 3;
        saveToServer();
    });

    setInterval(loadDataFromServer, 5000);
    loadDataFromServer();
</script>
</body>
</html>
